<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RaveCall – Venue streamer</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0B0618; color: #F4EEFF; max-width: 560px; margin: 40px auto; padding: 0 20px; }
  h1 { margin-bottom: 4px; }
  p.hint { color: #A497C2; margin-top: 0; }
  label { display: block; margin: 18px 0 6px; font-weight: 600; }
  input, select, button { font-size: 16px; padding: 10px 12px; border-radius: 10px; border: 1px solid #2C1E4D; background: #1A1030; color: #F4EEFF; width: 100%; box-sizing: border-box; }
  button { background: #B14CFF; border: none; font-weight: 700; cursor: pointer; margin-top: 20px; }
  button.stop { background: #3A1426; color: #FF3B5C; }
  button:disabled { opacity: .4; cursor: default; }
  #status { margin-top: 18px; padding: 12px; border-radius: 10px; background: #1A1030; white-space: pre-line; }
  .live { color: #FF3B5C; font-weight: 800; }
</style>
</head>
<body>
  <h1>Venue streamer</h1>
  <p class="hint">Pretend to be the venue: stream music into a RaveCall concert so phones can hear it.</p>

  <label for="code">Concert code</label>
  <select id="code">
    <option>NEON42</option>
    <option>BASS77</option>
  </select>

  <label for="file">Music file (mp3, m4a, wav…)</label>
  <input id="file" type="file" accept="audio/*" />

  <button id="start">Start streaming</button>
  <button id="stop" class="stop" disabled>Stop</button>

  <div id="status">Not streaming.</div>

  <!-- The music also plays out loud on this computer so you can hear it. -->
  <audio id="player" loop></audio>

<script type="module">
  import { Room, LocalAudioTrack, TokenSource, AudioPresets, Track } from 'https://cdn.jsdelivr.net/npm/livekit-client@2.24.1/+esm';

  const TOKEN_SERVER_ID = 'tech120prototype-jm1f6v';
  const $ = (id) => document.getElementById(id);
  let room = null;
  let ctx = null;

  function status(text) { $('status').innerHTML = text; }

  $('start').onclick = async () => {
    const file = $('file').files[0];
    if (!file) { status('Pick a music file first.'); return; }
    const code = $('code').value;
    $('start').disabled = true;
    try {
      status('Getting a token…');
      const source = TokenSource.developmentTokenServer(TOKEN_SERVER_ID);
      const { serverUrl, participantToken } = await source.fetch({
        roomName: `concert-${code}`,
        participantIdentity: `venue-${code}`,
        participantName: 'Venue',
      });

      // Play the file and capture its audio as a WebRTC track.
      const player = $('player');
      player.src = URL.createObjectURL(file);
      ctx = new AudioContext();
      const src = ctx.createMediaElementSource(player);
      const dest = ctx.createMediaStreamDestination();
      src.connect(dest);
      src.connect(ctx.destination); // also hear it locally
      await player.play();

      status('Connecting to LiveKit…');
      room = new Room();
      room.on('participantConnected', updateCount);
      room.on('participantDisconnected', updateCount);
      room.on('disconnected', () => { status('Disconnected.'); reset(); });
      await room.connect(serverUrl, participantToken);

      const track = new LocalAudioTrack(dest.stream.getAudioTracks()[0]);
      await room.localParticipant.publishTrack(track, {
        name: 'venue-music',
        source: Track.Source.Microphone,
        audioPreset: AudioPresets.musicHighQualityStereo,
        dtx: false,
        red: false,
        forceStereo: true,
      });
      $('stop').disabled = false;
      updateCount();
    } catch (e) {
      console.error(e);
      status('Error: ' + (e?.message || e));
      reset();
    }
  };

  function updateCount() {
    if (!room) return;
    const n = room.remoteParticipants.size;
    status(`<span class="live">● LIVE</span> streaming to concert-${$('code').value}\n` +
           `${n} listener${n === 1 ? '' : 's'} connected.`);
  }

  async function reset() {
    $('player').pause();
    if (ctx) { ctx.close(); ctx = null; }
    $('start').disabled = false;
    $('stop').disabled = true;
  }

  $('stop').onclick = async () => {
    const r = room; room = null;
    await r?.disconnect();
    reset();
    status('Stopped.');
  };
</script>
</body>
</html>
